<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAFFL - 2026 Voting</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #ffd700;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .back-link {
            display: inline-block;
            color: #ffd700;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .closed-notice {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,215,0,0.35);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            font-size: 1.15rem;
        }
        .form-container {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .form-container iframe {
            width: 100%;
            height: 1200px;
            border: none;
        }
        .external-link {
            display: inline-block;
            margin-top: 20px;
            color: #ffd700;
            text-decoration: none;
        }
        .external-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to Home</a>
        <h1>2026 VAFFL Voting</h1>
        <p class="subtitle">This vote is no longer open</p>

        <div class="closed-notice">
            <p>Voting for the 2026 season has closed.</p>
        </div>
    </div>
</body>
</html>
